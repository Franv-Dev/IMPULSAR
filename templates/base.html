<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}IMPULSAR – Impulsá tu emprendimiento local{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tipografías -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container navbar__content">
            <div class="navbar__logo">
                <span class="navbar__logo-mark">IMP</span>
                <span class="navbar__logo-text">IMPULSAR</span>
            </div>

            <nav class="navbar__links">
                <nav class="navbar__links">
                    <a href="{{ url_for('index') }}" class="navbar__link navbar__link--active">Inicio</a>
                    <a href="{{ url_for('blog.index') }}" class="navbar__link">Emprendimientos</a>
                    <a href="{{ url_for('about.index') }}" class="navbar__link">Sobre IMPULSAR</a>
                    <a href="{{ url_for('contact.index') }}" class="navbar__link">Contacto</a>
                </nav>
            </nav>

            <div class="navbar__actions">
                {% if g.user %}
                    <div class="navbar__user">
                        <button type="button" class="navbar__user-toggle">
                            <div class="navbar__avatar">
                                {{ g.user.username[0]|upper }}
                            </div>
                            <span class="navbar__user-name">
                                {{ g.user.username }}
                            </span>
                            <span class="navbar__user-caret">▾</span>
                        </button>

                        <div class="user-menu" id="user-menu">
                            <a href="#" class="user-menu__item">
                                Ver perfil
                            </a>
                            <a href="{{ url_for('auth.logout') }}" class="user-menu__item user-menu__item--danger">
                                Salir
                            </a>
                        </div>
                    </div>
                {% else %}
                    <a href="{{ url_for('auth.login') }}" class="btn btn--ghost">Acceder</a>
                    <a href="{{ url_for('auth.register') }}" class="btn btn--primary">Registrarse</a>
                {% endif %}
            </div>


            <!-- Botón mobile (queda para hacer funcional más adelante) -->
            <button class="navbar__toggle" aria-label="Abrir menú">
                ☰
            </button>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
    <div class="container footer__content">
        <span>© {{ 2025 }} IMPULSAR – Plataforma para emprendedores locales</span>
        <div class="footer__links">
            <a href="{{ url_for('terms.index') }}" class="footer__link">Términos</a>
            <a href="{{ url_for('privacy.index') }}" class="footer__link">Privacidad</a>
            <a href="{{ url_for('contact.index') }}" class="footer__link">Contacto</a>
        </div>
    </div>
</footer>


    <!-- JS principal -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
